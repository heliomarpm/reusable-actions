name: 'Create or Update PR'
description: 'Creates or updates a pull request with coverage info and labels'

inputs:
  head:
    description: 'Source branch'
    required: true
  base:
    description: 'Target branch'
    required: true
  pr-title:
    description: 'Title template for the Pull Request'
    required: false
    default: '🔀 PR ({{yyyy-MM-dd}}): {{HEAD_BRANCH}} → {{BASE_BRANCH}}'
  pr_title:
    description: 'Title template for the Pull Request (alias)'
    required: false
    default: ''
  pr-body:
    description: 'Inline markdown body for the Pull Request'
    required: false
    default: ''
  pr-body-path:
    description: 'Path for the Pull Request body file. Takes priority over pr-body'
    required: false
    default: ''
  coverage-status:
    description: 'Coverage status (passed | failed | missing)'
    required: false
    default: ''
  coverage-line:
    description: 'Line coverage percentage'
    required: false
    default: ''
  coverage-min:
    description: 'Minimum coverage percentage evaluated by Quality Gate'
    required: false
    default: ''
  coverage-mode:
    description: 'Coverage Mode (info/block/decrease) evaluated by Quality Gate'
    required: false
    default: 'info'
  github-token:
    description: 'GitHub token'
    required: true

outputs:
  pr-url:
    description: 'URL of the created/updated PR'
    value: ${{ steps.pr.outputs.pr_url }}
  pr_url:
    description: 'URL of the created/updated PR (alias)'
    value: ${{ steps.pr.outputs.pr_url }}
  pr-action:
    description: 'Whether PR was created or updated'
    value: ${{ steps.pr.outputs.pr_action }}
  pr_action:
    description: 'Whether PR was created or updated (alias)'
    value: ${{ steps.pr.outputs.pr_action }}

runs:
  using: 'composite'
  steps:
    - id: labels
      shell: bash
      run: |
        gh label create auto-generated --description "PR auto-generated" --color 006B75 --force || true
        gh label create coverage-failed --color D93F0B --force || true
        gh label create coverage-passed --color 0E8A16 --force || true
        gh label create coverage-missing --color E99695 --force || true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - id: pr
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASH_ENV: ${{ github.action_path }}/../../scripts/shared/shell-helpers.sh
        INPUT_PR_TITLE: ${{ inputs.pr-title }}
        INPUT_PR_BODY: ${{ inputs.pr-body }}
        INPUT_PR_BODY_PATH: ${{ inputs.pr-body-path }}
      run: |
        HEAD="${{ inputs.head }}"
        BASE="${{ inputs.base }}"
        STATUS="${{ inputs.coverage-status }}"
        TEMPLATES_DIR="${{ github.action_path }}/../../templates"
        DATE="$(date +'%Y-%m-%d')"

        # 1. Resolve o título do Pull Request com interpolação de placeholders
        DEFAULT_TITLE="🔀 PR ({{yyyy-MM-dd}}): {{HEAD_BRANCH}} → {{BASE_BRANCH}}"
        RAW_TITLE="${INPUT_PR_TITLE:-$DEFAULT_TITLE}"
        TITLE="$RAW_TITLE"
        TITLE="${TITLE//\{\{yyyy-MM-dd\}\}/$DATE}"
        TITLE="${TITLE//\{\{YYYY-MM-DD\}\}/$DATE}"
        TITLE="${TITLE//\{\{DATE\}\}/$DATE}"
        TITLE="${TITLE//\{\{HEAD_BRANCH\}\}/$HEAD}"
        TITLE="${TITLE//\{\{HEAD\}\}/$HEAD}"
        TITLE="${TITLE//\{\{BASE_BRANCH\}\}/$BASE}"
        TITLE="${TITLE//\{\{BASE\}\}/$BASE}"

        # Resolve labels baseadas no status de cobertura
        case "$STATUS" in
          failed)  ADD="coverage-failed";  DEL="coverage-passed,coverage-missing" ;;
          passed)  ADD="coverage-passed";  DEL="coverage-failed,coverage-missing" ;;
          missing) ADD="coverage-missing"; DEL="coverage-passed,coverage-failed"  ;;
          *)       ADD=""; DEL="" ;;
        esac

        COVERAGE_LINE="${{ inputs.coverage-line }}"
        MIN_COVERAGE="${{ inputs.coverage-min }}"
        MODE="${{ inputs.coverage-mode }}"

        # 2. Renderiza o bloco de cobertura
        if [ -n "$COVERAGE_LINE" ]; then
          render_template "$TEMPLATES_DIR/pr-quality-gate-table.md" quality_block.tmp \
            COVERAGE_LINE "$COVERAGE_LINE" \
            MIN_COVERAGE "$MIN_COVERAGE" \
            STATUS "$STATUS" \
            MODE "$MODE"
        else
          render_template "$TEMPLATES_DIR/pr-quality-gate-missing.md" quality_block.tmp
        fi
        QUALITY_GATE_RESULT=$(cat quality_block.tmp)
        rm -f quality_block.tmp

        # 3. Resolução do template do corpo do PR seguindo a ordem de precedência:
        # 1º: pr-body-path (se informado e existente)
        # 2º: pr-body (se informado inline)
        # 3º: .github/pull_request_template.md ou .github/pr_template.md
        # 4º: Template padrão da reusable action
        PR_TEMPLATE="$TEMPLATES_DIR/pr-body.md"
        TEMP_INLINE_FILE=""

        if [[ -n "$INPUT_PR_BODY_PATH" ]]; then
          if [[ -f "$INPUT_PR_BODY_PATH" ]]; then
            echo "→ Usando template customizado de pr-body-path: $INPUT_PR_BODY_PATH"
            PR_TEMPLATE="$INPUT_PR_BODY_PATH"
          else
            echo "::warning::Arquivo informado em pr-body-path não encontrado: '$INPUT_PR_BODY_PATH'. Tentando próximos fallbacks."
          fi
        fi

        if [[ "$PR_TEMPLATE" == "$TEMPLATES_DIR/pr-body.md" && -n "$INPUT_PR_BODY" ]]; then
          echo "→ Usando template inline fornecido em pr-body"
          TEMP_INLINE_FILE="custom_inline_template.tmp"
          printf '%s\n' "$INPUT_PR_BODY" > "$TEMP_INLINE_FILE"
          PR_TEMPLATE="$TEMP_INLINE_FILE"
        fi

        if [[ "$PR_TEMPLATE" == "$TEMPLATES_DIR/pr-body.md" ]]; then
          if [[ -f ".github/pull_request_template.md" ]]; then
            echo "→ Usando template nativo: .github/pull_request_template.md"
            PR_TEMPLATE=".github/pull_request_template.md"
          elif [[ -f ".github/pr_template.md" ]]; then
            echo "→ Usando template nativo: .github/pr_template.md"
            PR_TEMPLATE=".github/pr_template.md"
          else
            echo "→ Usando template padrão da reusable action: $PR_TEMPLATE"
          fi
        fi

        # 4. Renderiza o corpo final da PR
        render_template "$PR_TEMPLATE" pr_body.md \
          HEAD_BRANCH "$HEAD" \
          BASE_BRANCH "$BASE" \
          HEAD "$HEAD" \
          BASE "$BASE" \
          DATE "$DATE" \
          yyyy-MM-dd "$DATE" \
          QUALITY_GATE_RESULT "$QUALITY_GATE_RESULT"

        [[ -n "$TEMP_INLINE_FILE" ]] && rm -f "$TEMP_INLINE_FILE"

        PR_NUMBER=$(gh pr list --base "$BASE" --head "$HEAD" --json number --jq '.[0].number')

        if [[ -z "$PR_NUMBER" ]]; then
          echo "→ Criando novo Pull Request..."
          PR_OUTPUT=$(gh pr create --base "$BASE" --head "$HEAD" \
            --title "$TITLE" --body-file pr_body.md \
            --label "auto-generated${ADD:+,$ADD}" 2>&1) || PR_EXIT=$?

          if [[ ${PR_EXIT:-0} -ne 0 ]]; then
            # Se a falha for por ausência de commits novos
            if echo "$PR_OUTPUT" | grep -qiE "no commits between"; then
              echo "::notice::Não há commits de diferença entre '$BASE' e '$HEAD'. Pull Request dispensada."
              {
                echo "## 🔀 Auto PR (Dispensado)"
                echo ""
                echo "ℹ️ Não há commits de diferença entre as branches \`$HEAD\` e \`$BASE\`."
                echo "Nenhum Pull Request precisa ser criado no momento."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "pr_action=skipped" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "::error::$PR_OUTPUT"
            {
              echo "## ❌ Falha ao criar Pull Request"
              echo ""
              echo "\`\`\`"
              echo "$PR_OUTPUT"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$PR_EXIT"
          fi

          PR_URL=$(gh pr view "$HEAD" --json url --jq '.url' 2>/dev/null || echo "")
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(echo "$PR_OUTPUT" | grep -Eo 'https://github\.com/[^/]+/[^/]+/pull/[0-9]+' | head -n1 || true)
          fi
          echo "pr_action=created" >> $GITHUB_OUTPUT
        else
          echo "→ Atualizando Pull Request existente #$PR_NUMBER..."
          gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file pr_body.md \
            ${DEL:+--remove-label "$DEL"} ${ADD:+--add-label "$ADD"}
          PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
          echo "pr_action=updated" >> $GITHUB_OUTPUT
        fi

        echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
