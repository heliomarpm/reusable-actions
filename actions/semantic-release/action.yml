name: 'Semantic Release'
description: 'Runs semantic-release with stack-aware config'

inputs:
  stack:
    description: 'Project stack'
    required: false
    default: ''
  project-path:
    description: 'Path to the project root'
    required: false
    default: '.'
  config:
    description: 'Path to custom semantic-release config'
    required: false
    default: ''
  dry-run:
    description: 'Run in dry-run mode'
    required: false
    default: 'false'
  strict-mode:
    description: 'Fail if no conventional commits found'
    required: false
    default: 'true'
  debug:
    description: 'Enable debug output'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token'
    required: true
  branch:
    description: 'Target branch to evaluate (overrides GITHUB_REF for workflow_run)'
    required: false
    default: ''
  skip-version-file:
    description: 'Skip updating package.json / composer.json version'
    required: false
    default: 'false'
  skip-changelog:
    description: 'Skip generating CHANGELOG.md'
    required: false
    default: 'false'
  changelog-title:
    description: 'Header/Title of the CHANGELOG.md'
    required: false
    default: "# 📦 Changelog\n\nAll notable changes to this project will be documented in this file."
  prerelease-incremental:
    description: 'Whether to generate incremental pre-release tags (e.g. v1.0.0-rc.1) or use the same tag (v1.0.0)'
    required: false
    default: 'true'
  prerelease-suffix:
    description: 'Pre-release tag suffix when prerelease-incremental is true (default: "rc")'
    required: false
    default: 'rc'

outputs:
  version:
    description: 'Next release version (empty if none)'
    value: ${{ steps.release.outputs.version }}
  tag:
    description: 'Next release tag (empty if none)'
    value: ${{ steps.release.outputs.tag }}
  published:
    description: 'Whether a new version was published'
    value: ${{ steps.release.outputs.published }}
  release-type:
    description: 'Type of release (major, minor, patch)'
    value: ${{ steps.release.outputs.release_type }}

runs:
  using: 'composite'
  steps:
    - id: release
      shell: bash
      working-directory: ${{ inputs.project-path }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        STACK: ${{ inputs.stack }}
        BRANCH: ${{ inputs.branch }}
        GITHUB_REF: ${{ inputs.branch != '' && format('refs/heads/{0}', inputs.branch) || env.GITHUB_REF }}
        GITHUB_REF_NAME: ${{ inputs.branch || env.GITHUB_REF_NAME }}
        SEMANTIC_RELEASE_CONFIG: ${{ inputs.config }}
        SEMANTIC_RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        STRICT_CONVENTIONAL_COMMITS: ${{ inputs.strict-mode }}
        SEMANTIC_RELEASE_DEBUG_MODE: ${{ inputs.debug }}
        PRERELEASE_INCREMENTAL: ${{ inputs.prerelease-incremental }}
        PRERELEASE_SUFFIX: ${{ inputs.prerelease-suffix }}
        REUSABLE_PATH: ${{ github.action_path }}/../..
        PROJECT_PATH: ${{ inputs.project-path }}
        SEMANTIC_RELEASE_SKIP_VERSION: ${{ inputs.skip-version-file }}
        SEMANTIC_RELEASE_SKIP_CHANGELOG: ${{ inputs.skip-changelog }}
        CHANGELOG_TITLE: ${{ inputs.changelog-title }}
        SEMANTIC_RELEASE_CHANGELOG_TITLE: ${{ inputs.changelog-title }}
      run: |
        SCRIPT="${{ github.action_path }}/../../scripts/shared/semantic-release/run.sh"
        chmod +x "$SCRIPT"
        "$SCRIPT"
