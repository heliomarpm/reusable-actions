name: 'Run Coverage'
description: 'Runs test coverage and normalizes output'

inputs:
  stack:
    description: 'Project stack'
    required: true
  project-path:
    description: 'Path to the project root'
    required: false
    default: '.'
  coverage-min:
    description: 'Minimum coverage threshold (0-100)'
    required: false
    default: 80
  coverage-mode:
    description: 'Enable strict mode for coverage (info | block | decrease)'
    required: false
    default: 'info'

outputs:
  line:
    description: 'Line coverage percentage'
    value: ${{ steps.evaluate.outputs.line }}
  status:
    description: 'Coverage status: passed | failed | missing'
    value: ${{ steps.evaluate.outputs.status }}

runs:
  using: 'composite'
  steps:
    - id: coverage
      shell: bash
      working-directory: ${{ inputs.project-path }}
      env:
        BASH_ENV: ${{ github.action_path }}/../../scripts/shared/shell-helpers.sh
      run: |
        SCRIPT="${{ github.action_path }}/../../scripts/plugins/${{ inputs.stack }}/coverage.sh"
        if [[ -f "$SCRIPT" ]]; then
          chmod +x "$SCRIPT"
          "$SCRIPT" || true
        else
          echo "⚠️ No coverage.sh found for stack ${{ inputs.stack }}"
        fi

        FILE="coverage/coverage-summary.normalized.json"
        if [[ -f "$FILE" ]]; then
          LINE=$(jq -r '.line // empty' "$FILE")
          echo "line=$LINE" >> $GITHUB_OUTPUT
          echo "report=found" >> $GITHUB_OUTPUT
        else
          echo "line=" >> $GITHUB_OUTPUT
          echo "report=not-found" >> $GITHUB_OUTPUT
        fi

    - id: evaluate
      shell: bash
      working-directory: ${{ inputs.project-path }}
      env:
        BASH_ENV: ${{ github.action_path }}/../../scripts/shared/shell-helpers.sh
      run: |
        REPORT="${{ steps.coverage.outputs.report }}"
        LINE="${{ steps.coverage.outputs.line }}"
        MIN="${{ inputs.coverage-min }}"
        MODE="${{ inputs.coverage-mode }}"
        STATUS="missing"

        if [[ "$REPORT" == "not-found" || -z "$LINE" ]]; then
          STATUS="missing"
          echo "status=missing" >> $GITHUB_OUTPUT
          echo "line=" >> $GITHUB_OUTPUT
          if [[ "$MODE" == "block" ]]; then
            fail "❌ Quality Gate Bloqueado: Cobertura de testes não encontrada e coverage-mode está como 'block'."
          fi
        elif (( $(echo "$LINE < $MIN" | bc -l) )); then
          STATUS="failed"
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "line=$LINE" >> $GITHUB_OUTPUT
          if [[ "$MODE" == "block" ]]; then
            fail "❌ Quality Gate Bloqueado: Cobertura ($LINE%) abaixo da meta mínima ($MIN%) e coverage-mode está como 'block'."
          fi
        else
          STATUS="passed"
          echo "status=passed" >> $GITHUB_OUTPUT
          echo "line=$LINE" >> $GITHUB_OUTPUT
        fi

        # Enriquece o arquivo de contrato normalizado com a decisão do Quality Gate
        FILE="coverage/coverage-summary.normalized.json"
        if [[ -f "$FILE" ]]; then
          jq --arg status "$STATUS" --arg min "$MIN" --arg mode "$MODE" \
            '.status = $status | .min = ($min | tonumber) | .mode = $mode' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
        fi
