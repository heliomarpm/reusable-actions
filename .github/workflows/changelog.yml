name: "Changelog & Release"

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      create-release:
        description: 'Forçar criação de Git Tag e GitHub Release'
        type: boolean
        default: false

jobs:
  changelog:
    name: 📝 Update Changelog & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📌 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Run Changelog Action
        uses: ./actions/changelog
        # with:
        #   branch: ${{ github.ref_name }}
        #   create-release: ${{ (github.event_name == 'workflow_dispatch' && inputs.create-release) || github.ref_name == 'main' }}
        #   github-token: ${{ secrets.GITHUB_TOKEN }}