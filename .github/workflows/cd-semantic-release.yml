name: CD - Semantic Release

on:
  workflow_call:
    inputs:
      skip-version-file:
        description: 'Skip updating package.json / composer.json version'
        required: false
        type: boolean
        default: false
      skip-changelog:
        description: 'Skip generating CHANGELOG.md'
        required: false
        type: boolean
        default: false
      stack:
        description: 'Stack the project. (node | php | dotnet | python | go | empty for auto-detect)'
        required: false
        type: string
        default: null
      project-path:
        description: 'Project path source code in consumer repository '
        required: false
        type: string
        default: '.'

      semantic-release-config:
        description: 'Path to semantic-release config file.'
        required: false
        type: string
      semantic-release-dry-run:
        description: 'Dry run mode for semantic-release. (default: false -> true for PRs)'
        required: false
        type: boolean
        default: false
      semantic-release-debug-mode:
        description: 'Debug mode for semantic-release.'
        required: false
        type: boolean
        default: false
      strict-conventional-commits:
        description: 'Fail pipeline if no conventional commits are found'
        required: false
        type: boolean
        default: true
      prerelease-strategy:
        description: 'Estratégia de pre-release para branches release-* ("rc" ou "same-tag")'
        required: false
        type: string
        default: 'rc'
      prerelease-suffix:
        description: 'Sufixo da pre-release quando strategy for "rc" (default: "rc")'
        required: false
        type: string
        default: 'rc'

    secrets:
      GH_TOKEN:
        required: true

    outputs:
      version:
        description: 'Next release version (empty if none)'
        value: ${{ jobs.semantic-release.outputs.version }}
      tag:
        description: 'Next release tag (empty if none)'
        value: ${{ jobs.semantic-release.outputs.tag }}
      published:
        description: 'Whether a new version was published'
        value: ${{ jobs.semantic-release.outputs.published }}

permissions:
  contents: write       # Permite criar e atualizar tags, commits, releases e pushes
  issues: write         # Permite ao semantic-release comentar em issues fechadas pela release
  pull-requests: write  # Permite ao semantic-release comentar nos PRs incluídos na release
  
jobs:
  workdir: 
    runs-on: ubuntu-latest
    env:
      REUSABLE_PATH: __reusable_actions__
    outputs:
      path: ${{ steps.path.outputs.value }}  
    
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v7

      - name: 📌 Checkout reusable-workflows scripts
        uses: actions/checkout@v7
        with:
          repository: heliomarpm/reusable-workflows
          ref: main
          path: ${{ env.REUSABLE_PATH }}

      - name: 👀 Files in workspace
        run: |
          echo "📂 Current directory:"
          pwd
          echo "📄 Files in root:"
          ls -la

      - name: 📐 Resolve project path
        id: path
        run: |
          source "$(pwd)/${{ env.REUSABLE_PATH }}/scripts/shared/shell-helpers.sh"
          PROJECT_PATH="$(resolve_project_path '${{ inputs.project-path }}')"

          log "🔹 Using project path: $PROJECT_PATH"
          echo "value=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

  semantic-release:
    runs-on: ubuntu-latest
    needs: workdir
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      published: ${{ steps.release.outputs.published }}
    env:
      REUSABLE_PATH: ${{ github.workspace }}/__reusable_actions__
      BASH_ENV: ${{ github.workspace }}/__reusable_actions__/scripts/shared/shell-helpers.sh

    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.workdir.outputs.path || '.' }}

    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v7
        with: 
          fetch-depth: 0 	  # Necessário para o semantic-release inspecionar histórico
          fetch-tags: true 	# Necessário para o semantic-release inspecionar tags
          persist-credentials: true  # → permite push com GITHUB_TOKEN
          token: ${{ secrets.GH_TOKEN }} # Necessário para autenticar PUSH

      - name: 📌 Checkout reusable-workflows scripts
        uses: actions/checkout@v7
        with:
          repository: heliomarpm/reusable-workflows
          ref: main
          path: ${{ env.REUSABLE_PATH }}
          token: ${{ secrets.GH_TOKEN }} # Necessário se o repositório for privado

      - name: 👀 Files in workspace
        run: |
          ls_files

      - name: 🔍 Resolve project stack
        id: stack
        run: |
          source "$BASH_ENV"

          SKIP_VERSION="${{ inputs.skip-version-file }}"
          INPUT_STACK="${{ inputs.stack }}"

          # ------------------------------------------------------------
          # 1. Se skip-version-file = true: resolução de stack é ignorada
          # ------------------------------------------------------------
          if [[ "$SKIP_VERSION" == "true" ]]; then
            log "⏩ skip-version-file ativo: resolução de stack ignorada (modo genérico)"
            echo "value=generic" >> "$GITHUB_OUTPUT"
            echo "source=skipped" >> "$GITHUB_OUTPUT"
            {
              echo "> ℹ️ **Versionamento de manifesto ignorado (\`skip-version-file: true\`):** A resolução de stack não é necessária. O Semantic Release executará no modo genérico (criação de Git Tag, GitHub Release e CHANGELOG)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ------------------------------------------------------------
          # 3. Se a stack foi informada pelo consumidor: validação bloqueante
          # ------------------------------------------------------------
          if [[ -n "$INPUT_STACK" ]]; then
            log "🔹 Validando stack informada pelo consumidor: $INPUT_STACK"
            PLUGIN_CONFIG_JS="$REUSABLE_PATH/scripts/plugins/$INPUT_STACK/releaserc.js"
            PLUGIN_CONFIG_JSON="$REUSABLE_PATH/scripts/plugins/$INPUT_STACK/releaserc.json"

            if [[ -f "$PLUGIN_CONFIG_JS" || -f "$PLUGIN_CONFIG_JSON" ]]; then
              log "✅ Stack informada suportada: $INPUT_STACK"
              echo "value=$INPUT_STACK" >> "$GITHUB_OUTPUT"
              echo "source=input" >> "$GITHUB_OUTPUT"
              exit 0
            else
              {
                echo "## ❌ Falha no Semantic Release: Stack Não Suportada"
                echo ""
                echo "A stack informada manualmente (**\`$INPUT_STACK\`**) não possui plugin de release para atualização de manifesto."
                echo ""
                echo "- **Stacks suportadas para versionamento de arquivos:** \`node\`, \`php\`"
                echo ""
                echo "> 💡 **Dica:** Se o projeto não necessita de atualização automática de arquivos de versão (ex: \`package.json\`, \`composer.json\`), defina o input \`skip-version-file: true\` para executar a release no modo genérico."
              } >> "$GITHUB_STEP_SUMMARY"
              fail "A stack '$INPUT_STACK' informada pelo consumidor não é suportada para atualização de versão pelo Semantic Release."
            fi
          fi

          # ------------------------------------------------------------
          # 2. Auto-detecção: não bloqueante se não identificada ou diferente das suportadas
          # ------------------------------------------------------------
          SCRIPT="$REUSABLE_PATH/scripts/shared/detect-stack.sh"
          DETECTED_STACK=""
          if [[ -f "$SCRIPT" ]]; then
            chmod +x "$SCRIPT"
            DETECTED_STACK=$(bash "$SCRIPT" 2>/dev/null || true)
          fi

          if [[ -z "$DETECTED_STACK" ]]; then
            log "⚠️ Nenhuma stack identificada automaticamente. Prosseguindo no modo genérico."
            echo "value=generic" >> "$GITHUB_OUTPUT"
            echo "source=not-detected" >> "$GITHUB_OUTPUT"
            {
              echo "> ℹ️ **Stack não identificada automaticamente:** O Semantic Release prosseguirá normalmente no **modo genérico** (criação de Git Tag, GitHub Release e CHANGELOG, sem atualizar arquivos de versão de pacotes)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PLUGIN_CONFIG_JS="$REUSABLE_PATH/scripts/plugins/$DETECTED_STACK/releaserc.js"
          PLUGIN_CONFIG_JSON="$REUSABLE_PATH/scripts/plugins/$DETECTED_STACK/releaserc.json"

          if [[ -f "$PLUGIN_CONFIG_JS" || -f "$PLUGIN_CONFIG_JSON" ]]; then
            log "✅ Stack suportada detectada automaticamente: $DETECTED_STACK"
            echo "value=$DETECTED_STACK" >> "$GITHUB_OUTPUT"
            echo "source=detected" >> "$GITHUB_OUTPUT"
            exit 0
          else
            log "ℹ️ Stack detectada '$DETECTED_STACK' não possui plugin de versão. Prosseguindo no modo genérico."
            echo "value=generic" >> "$GITHUB_OUTPUT"
            echo "source=detected-unsupported" >> "$GITHUB_OUTPUT"
            {
              echo "> ℹ️ **Stack detectada:** \`$DETECTED_STACK\` (sem plugin dedicado para atualização de arquivos de versão). O Semantic Release prosseguirá normalmente no **modo genérico** (criação de Git Tag, GitHub Release e CHANGELOG)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: ⚙️ Configurar Usuário Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Run Release
        id: release
        run: |
          SCRIPT="$REUSABLE_PATH/scripts/shared/semantic-release/run.sh"
          chmod +x "$SCRIPT"
          "$SCRIPT"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          STACK: ${{ steps.stack.outputs.value }}
          REUSABLE_PATH: ${{ env.REUSABLE_PATH }}
          PROJECT_PATH: ${{ needs.workdir.outputs.path || inputs.project-path || '.' }}
          SEMANTIC_RELEASE_CONFIG: ${{ inputs.semantic-release-config }}
          SEMANTIC_RELEASE_DRY_RUN: ${{ inputs.semantic-release-dry-run }}
          SEMANTIC_RELEASE_DEBUG_MODE: ${{ inputs.semantic-release-debug-mode }}
          STRICT_CONVENTIONAL_COMMITS: ${{ inputs.strict-conventional-commits }}
          PRERELEASE_STRATEGY: ${{ inputs.prerelease-strategy || 'rc' }}
          PRERELEASE_SUFFIX: ${{ inputs.prerelease-suffix || 'rc' }}
          SEMANTIC_RELEASE_SKIP_VERSION: ${{ inputs.skip-version-file }}
          SEMANTIC_RELEASE_SKIP_CHANGELOG: ${{ inputs.skip-changelog }}

      - name: 🧾 Job Summary (Fallback em Falha)
        if: failure() && steps.release.outcome == 'failure'
        run: |
          {
            echo "## ❌ Falha no Semantic Release"
            echo ""
            echo "**📂 Project path:** \`${{ inputs.project-path }}\`"
            echo "**🧱 Stack:** \`${{ steps.stack.outputs.value || 'não definida' }}\`"
            echo ""
            echo "> ⚠️ Ocorreu um erro durante a execução do Semantic Release. Verifique os logs da etapa anterior para mais detalhes."
          } >> "$GITHUB_STEP_SUMMARY"
