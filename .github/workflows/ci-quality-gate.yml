name: CI - Quality Gate

on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack override (empty for auto-detect)'
        required: false
        type: string
        default: ''
      stack-version:
        description: 'Runtime Stack version (node [default: lts/*], php [default: 8.3], dotnet [default: 9.0], python [default: 3.11], go [default: 1.25])'
        required: false
        type: string
        default: ''
      project-path:
        description: 'Project path source code in consumer repository'
        required: false
        type: string
        default: '.'
      coverage-min:
        description: 'Minimum coverage threshold (0-100)'
        type: number
        required: false
        default: 80
      coverage-mode:
        description: 'Coverage mode (info | block | decrease)'
        type: string
        required: false
        default: 'info'
      coverage-continue-on-failure:
        description: 'Continue pipeline even if tests fail. (default: true)'
        required: false
        type: boolean
        default: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v7

      - name: 📌 Checkout reusable-actions scripts
        uses: actions/checkout@v7
        with:
          repository: heliomarpm/reusable-actions
          ref: main
          path: __reusable_actions__

      - name: 🔍 Detect Stack
        uses: ./__reusable_actions__/actions/detect-stack
        id: stack
        with:
          stack: ${{ inputs.stack }}
          project-path: ${{ inputs.project-path }}

      - name: ⚙️ Setup Runtime
        uses: ./__reusable_actions__/actions/setup-runtime
        with:
          stack: ${{ steps.stack.outputs.stack }}
          stack-version: ${{ inputs.stack-version }}
          project-path: ${{ inputs.project-path }}

      - name: 🧪 Run Tests
        uses: ./__reusable_actions__/actions/run-tests
        id: tests
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ inputs.project-path }}
          coverage-mode: ${{ inputs.coverage-mode }}

      - name: 📊 Run Coverage
        uses: ./__reusable_actions__/actions/run-coverage
        id: coverage
        continue-on-error: ${{ inputs.coverage-continue-on-failure }}
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ inputs.project-path }}
          coverage-min: ${{ inputs.coverage-min }}
          coverage-mode: ${{ inputs.coverage-mode }}
          github-token: ${{ secrets.GITHUB_TOKEN || secrets.GH_TOKEN || github.token }}

      - name: 📦 Upload coverage artifact
        if: always() && steps.coverage.outputs.status != 'missing'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ inputs.project-path }}/coverage/coverage-summary.normalized.json

      - name: 🧾 Job Summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          BASH_ENV: ${{ github.workspace }}/__reusable_actions__/scripts/shared/shell-helpers.sh
        run: |
          HELPERS="${{ github.workspace }}/__reusable_actions__/scripts/shared/shell-helpers.sh"
          if [[ -f "$HELPERS" ]]; then
            source "$HELPERS"
          fi
          append_template_to_summary "${{ github.workspace }}/__reusable_actions__/templates/summary-quality-gate.md" \
            STACK "${{ steps.stack.outputs.stack }}" \
            SOURCE "${{ steps.stack.outputs.source }}" \
            TESTS_STATUS "${{ steps.tests.outputs.status || 'skipped' }}" \
            COVERAGE_LINE "${{ steps.coverage.outputs.line || 'N/A' }}" \
            COVERAGE_STATUS "${{ steps.coverage.outputs.status || 'not executed' }}"
