name: CI - Quality Gate

on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack override (empty for auto-detect)'
        required: false
        type: string
        default: ''
      project_path:
        description: 'Project path'
        required: false
        type: string
        default: '.'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: 'lts/*'
      php-version:
        description: 'PHP version'
        required: false
        type: string
        default: '8.3'
      min-coverage:
        description: 'Minimum coverage (0-100)'
        type: number
        required: false
        default: 80
      coverage-mode:
        description: 'Coverage mode (info | block)'
        type: string
        required: false
        default: 'info'
      coverage_continue_on_failure:
        description: 'Continue pipeline even if tests fail. (default: true)'
        required: false
        type: boolean
        default: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v4

      - name: 📌 Checkout reusable-actions scripts
        uses: actions/checkout@v4
        with:
          repository: heliomarpm/reusable-actions
          ref: main
          path: __reusable_actions__

      - name: 🔍 Detect Stack
        uses: ./__reusable_actions__/actions/detect-stack
        id: stack
        with:
          stack: ${{ inputs.stack }}
          project-path: ${{ inputs.project_path }}

      - name: ⚙️ Setup Runtime
        uses: ./__reusable_actions__/actions/setup-runtime
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ inputs.project_path }}
          node-version: ${{ inputs.node-version }}
          php-version: ${{ inputs.php-version }}

      - name: 🧪 Run Tests
        uses: ./__reusable_actions__/actions/run-tests
        id: tests
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ inputs.project_path }}

      - name: 📊 Run Coverage
        uses: ./__reusable_actions__/actions/run-coverage
        id: coverage
        continue-on-error: ${{ inputs.coverage_continue_on_failure }}
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ inputs.project_path }}
          min-coverage: ${{ inputs.min-coverage }}
          coverage-mode: ${{ inputs.coverage-mode }}

      - name: 📦 Upload coverage artifact
        if: steps.coverage.outputs.status != 'missing'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.project_path }}/coverage/coverage-summary.normalized.json

      - name: 🧾 Job Summary
        if: always()
        run: |
          {
            echo "## 🧪 Quality Gate"
            echo ""
            echo "**Stack:** \`${{ steps.stack.outputs.stack }}\` (_${{ steps.stack.outputs.source }}_)"
            echo "**Tests:** ${{ steps.tests.outputs.status || 'skipped' }}"
            echo "**Coverage:** ${{ steps.coverage.outputs.line || 'N/A' }}% — Status: ${{ steps.coverage.outputs.status || 'not executed' }}"
          } >> $GITHUB_STEP_SUMMARY
