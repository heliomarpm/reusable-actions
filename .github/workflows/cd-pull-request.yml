name: CD - Pull Request

on:
  workflow_call:
    inputs:
      strategy:
        description: 'Promotion strategy (trunk | develop | gitflow)'
        required: false
        type: string
        default: 'develop'
      main_branch:
        description: 'Main branch name'
        required: false
        type: string
        default: 'main'
      develop_branch:
        description: 'Develop branch name'
        required: false
        type: string
        default: 'develop'
      prefix_release_branch:
        description: 'Release branch prefix'
        required: false
        type: string
        default: 'release-'
      min-coverage:
        type: number
        required: false
        default: 80
      coverage-mode:
        type: string
        required: false
        default: 'info'
      semantic_release_config:
        type: string
        required: false
      strict_conventional_commits:
        type: boolean
        required: false
        default: true
      stack:
        type: string
        required: false
        default: ''
      project_path:
        type: string
        required: false
        default: '.'
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.engine.outputs.head }}
      base: ${{ steps.engine.outputs.base }}
      action: ${{ steps.engine.outputs.action }}
      skip: ${{ steps.engine.outputs.skip }}
    steps:
      - name: 🧠 Promotion Engine
        id: engine
        run: |
          STRATEGY="${{ inputs.strategy }}"
          HEAD="${{ github.ref_name }}"
          MAIN="${{ inputs.main_branch }}"
          DEV="${{ inputs.develop_branch }}"
          PREFIX="${{ inputs.prefix_release_branch }}"

          echo "→ Strategy: $STRATEGY"
          echo "→ Head: $HEAD"

          # Hotfix override
          if [[ "$HEAD" == hotfix/* ]]; then
            echo "base=$MAIN" >> $GITHUB_OUTPUT
            echo "head=$HEAD" >> $GITHUB_OUTPUT
            echo "action=pr_to_main" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Main branch — nada a promover
          if [[ "$HEAD" == "$MAIN" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "$STRATEGY" in
            trunk)
              echo "base=$MAIN" >> $GITHUB_OUTPUT
              echo "action=pr_to_main" >> $GITHUB_OUTPUT
              ;;
            develop)
              if [[ "$HEAD" == "$DEV" ]]; then
                echo "base=$MAIN" >> $GITHUB_OUTPUT
                echo "action=pr_to_main_on_release" >> $GITHUB_OUTPUT
              else
                echo "base=$DEV" >> $GITHUB_OUTPUT
                echo "action=pr_to_develop" >> $GITHUB_OUTPUT
              fi
              ;;
            gitflow)
              if [[ "$HEAD" == "$DEV" ]]; then
                echo "base=__release__" >> $GITHUB_OUTPUT
                echo "action=pr_to_release" >> $GITHUB_OUTPUT
              elif [[ "$HEAD" == ${PREFIX}* ]]; then
                echo "base=$MAIN" >> $GITHUB_OUTPUT
                echo "action=pr_to_main" >> $GITHUB_OUTPUT
              else
                echo "base=$DEV" >> $GITHUB_OUTPUT
                echo "action=pr_to_develop" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          echo "head=$HEAD" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

  promote:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: 📌 Checkout reusable-actions scripts
        uses: actions/checkout@v4
        with:
          repository: heliomarpm/reusable-actions
          ref: main
          path: __reusable_actions__
          token: ${{ secrets.GH_TOKEN }}

      - name: 🔐 Auth GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 📥 Download coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage

      - name: 📊 Read coverage report
        id: coverage
        run: |
          FILE="coverage/coverage-summary.normalized.json"
          if [ -f "$FILE" ]; then
            LINE=$(jq '.line' "$FILE")
            echo "line=$LINE" >> $GITHUB_OUTPUT
            echo "status=found" >> $GITHUB_OUTPUT
          else
            echo "status=missing" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Detect Stack
        uses: ./__reusable_actions__/actions/detect-stack
        id: stack
        with:
          stack: ${{ inputs.stack }}
          project-path: ${{ inputs.project_path }}

      - name: 🚀 Resolve Semantic Release
        id: semantic-release
        if: contains(needs.resolve.outputs.action, 'release') || contains(needs.resolve.outputs.action, 'on_release')
        uses: ./__reusable_actions__/actions/semantic-release
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ inputs.project_path }}
          config: ${{ inputs.semantic_release_config }}
          dry-run: 'true'
          strict-mode: ${{ inputs.strict_conventional_commits }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: 🌱 Resolve Release Branch
        id: branch
        run: |
          ACTION="${{ needs.resolve.outputs.action }}"
          BASE="${{ needs.resolve.outputs.base }}"
          VERSION="${{ steps.semantic-release.outputs.version }}"

          if [[ "$ACTION" == "pr_to_main_on_release" || "$ACTION" == "pr_to_release" ]]; then
            if [[ -z "$VERSION" ]]; then
              echo "::notice::No new release detected. Skipping PR."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          if [[ "$ACTION" == "pr_to_release" ]]; then
            BASE="${{ inputs.prefix_release_branch }}$VERSION"
            if git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
              git fetch origin "$BASE":"$BASE"
              git checkout "$BASE"
            else
              git checkout -b "$BASE"
              git push -u origin "$BASE"
            fi
          fi

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 📜 Create or Update Pull Request
        if: steps.branch.outputs.skip != 'true'
        uses: ./__reusable_actions__/actions/create-pr
        id: pr
        with:
          head: ${{ needs.resolve.outputs.head }}
          base: ${{ steps.branch.outputs.base }}
          coverage-status: ${{ steps.coverage.outputs.status }}
          coverage-line: ${{ steps.coverage.outputs.line }}
          min-coverage: ${{ inputs.min-coverage }}
          coverage-mode: ${{ inputs.coverage-mode }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: 🧾 Job summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🔀 Auto Pull Request

          **Strategy:** ${{ inputs.strategy }}  
          **Action:** ${{ needs.resolve.outputs.action }}

          EOF

          if [[ "${{ steps.branch.outputs.skip }}" == "true" ]]; then
            echo "ℹ️ **Skipped**: No new release detected by semantic-release." >> $GITHUB_STEP_SUMMARY
          else
            echo "**From:** \`${{ needs.resolve.outputs.head }}\`  " >> $GITHUB_STEP_SUMMARY
            echo "**To:** \`${{ steps.branch.outputs.base }}\`  " >> $GITHUB_STEP_SUMMARY
            echo "🔗 **PR:** ${{ steps.pr.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          fi
