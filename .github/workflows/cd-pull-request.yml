name: CD - Pull Request
# run-name: "🔀 Auto PR: ${{ github.head_ref || github.ref_name }} → ${{ (github.head_ref == 'develop' || github.ref_name == 'develop') && 'main' || 'develop' }}"
# run-name: "🔀 Auto PR: ${{ github.head_ref }} → ${{ startsWith(github.head_ref, 'hotfix/') && 'main' || (github.head_ref == 'develop' && 'main' || 'develop') }}"
run-name: >-
  🔀 Auto PR: (${{ github.head_ref || github.ref_name }} → ${{
    startsWith(github.head_ref || github.ref_name, 'hotfix') && 'main' ||
    (startsWith(github.head_ref || github.ref_name, 'release') && 'main' ||
    ((github.head_ref == 'develop' || github.ref_name == 'develop') && 'release-*' || 'develop'))
  }}): ${{ github.event.head_commit.message || 'Disparo manual' }}


on:
  workflow_call:
    inputs:      
      strategy:
        description: 'Promotion strategy (trunk | develop | gitflow )'
        required: false
        type: string
        default: 'develop'
      main-branch:
        description: 'Main branch name'
        required: false
        type: string
        default: 'main'
      develop-branch:
        description: 'Develop branch name'
        required: false
        type: string
        default: 'develop'
      project-path:
        description: 'Project path source code in consumer repository (Used for gitflow, develop strategy)'
        required: false
        type: string
        default: '.'        
      prefix-release-branch:
        description: 'Release branch prefix (Used for gitflow strategy. ex. release-)'
        required: false
        type: string
        default: 'release-'
      semantic-release-config:
        description: 'Path to semantic-release configuration file (used only when strategy is gitflow or develop)'
        type: string
        required: false
      strict-conventional-commits:
        description: 'Enable strict mode for semantic-release (used only when strategy is gitflow or develop)'
        type: boolean
        required: false
        default: false
      pr-title:
        description: 'Title template for the Pull Request'
        required: false
        type: string
        default: '🔀 PR ({{yyyy-MM-dd}}): {{HEAD_BRANCH}} → {{BASE_BRANCH}}'
      pr-body:
        description: 'Inline markdown body for the Pull Request'
        required: false
        type: string
        default: ''
      pr-body-path:
        description: 'Path for the Pull Request body file. Takes priority over pr-body'
        required: false
        type: string
        default: ''

      
      stack:
        description: 'Stack override (empty for auto-detect)'
        required: false
        type: string
        default: ''
      stack-version:
        description: 'Runtime Stack version'
        required: false
        type: string
        default: ''
      coverage-min:
        description: 'Minimum coverage threshold (0-100)'
        type: number
        required: false
        default: 80
      coverage-mode:
        description: 'Coverage mode (info | block | decrease)'
        type: string
        required: false
        default: 'info'
      coverage-continue-on-failure:
        description: 'Continue pipeline even if tests fail'
        required: false
        type: boolean
        default: true
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: write       # Permite criar e atualizar branches e pushes
  pull-requests: write  # Permite criar e atualizar pull requests
  # checks: read          # → se precisar ler check runs


jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.engine.outputs.head }}
      base: ${{ steps.engine.outputs.base }}
      action: ${{ steps.engine.outputs.action }}
      skip: ${{ steps.engine.outputs.skip }}
    steps:
      - name: 🧠 Promotion Engine
        id: engine
        run: |
          STRATEGY="${{ inputs.strategy }}"
          HEAD="${{ github.head_ref || github.head_ref || github.ref_name }}"
          MAIN="${{ inputs.main-branch }}"
          DEV="${{ inputs.develop-branch }}"
          PREFIX="${{ inputs.prefix-release-branch }}"

          echo "→ Strategy: $STRATEGY"
          echo "→ Head: $HEAD"

          # Hotfix override
          if [[ "$HEAD" == hotfix/* ]]; then
            echo "base=$MAIN" >> $GITHUB_OUTPUT
            echo "head=$HEAD" >> $GITHUB_OUTPUT
            echo "action=pr_to_main" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Main branch — nada a promover
          if [[ "$HEAD" == "$MAIN" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            {
              echo "## 🔀 Auto PR (Ignorado)"
              echo ""
              echo "ℹ️ A branch atual é a \`$MAIN\` (destino final). Não há níveis superiores para criar um Pull Request de promoção."
              echo "👉 *Para gerar uma versão final, certifique-se de executar o workflow de Semantic Release.*"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$STRATEGY" in
            trunk)
              echo "base=$MAIN" >> $GITHUB_OUTPUT
              echo "action=pr_to_main" >> $GITHUB_OUTPUT
              ;;
            develop)
              if [[ "$HEAD" == "$DEV" ]]; then
                echo "base=$MAIN" >> $GITHUB_OUTPUT
                echo "action=pr_to_main_on_release" >> $GITHUB_OUTPUT
              else
                echo "base=$DEV" >> $GITHUB_OUTPUT
                echo "action=pr_to_develop" >> $GITHUB_OUTPUT
              fi
              ;;
            gitflow)
              if [[ "$HEAD" == "$DEV" ]]; then
                echo "base=__release__" >> $GITHUB_OUTPUT
                echo "action=pr_to_release" >> $GITHUB_OUTPUT
              elif [[ "$HEAD" == ${PREFIX}* ]]; then
                echo "base=$MAIN" >> $GITHUB_OUTPUT
                echo "action=pr_to_main" >> $GITHUB_OUTPUT
              else
                echo "base=$DEV" >> $GITHUB_OUTPUT
                echo "action=pr_to_develop" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          echo "head=$HEAD" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

  workdir: 
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      REUSABLE_PATH: __reusable_actions__
    outputs:
      path: ${{ steps.path.outputs.value }}  
    
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head }}

      - name: 📌 Checkout reusable-workflows scripts
        uses: actions/checkout@v7
        with:
          repository: heliomarpm/reusable-workflows
          ref: main
          path: ${{ env.REUSABLE_PATH }}

      - name: 👀 Files in workspace
        run: |
          echo "📂 Current directory:"
          pwd
          echo "📄 Files in root:"
          ls -la

      - name: 📐 Resolve project path
        id: path
        run: |
          source "$(pwd)/${{ env.REUSABLE_PATH }}/scripts/shared/shell-helpers.sh"
          PROJECT_PATH="$(resolve_project_path '${{ inputs.project-path }}')"

          log "🔹 Using project path: $PROJECT_PATH"
          echo "value=$PROJECT_PATH" >> "$GITHUB_OUTPUT"


  quality-gate:
    needs: workdir
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      tests_status: ${{ steps.tests.outputs.status }}
      coverage_status: ${{ steps.coverage.outputs.status }}
      coverage_line: ${{ steps.coverage.outputs.line }}
      coverage_min: ${{ steps.coverage.outputs.min }}
      coverage_mode: ${{ steps.coverage.outputs.mode }}
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.head }}

      - name: 📌 Checkout reusable-workflows scripts
        uses: actions/checkout@v7
        with:
          repository: heliomarpm/reusable-workflows
          ref: main
          path: __reusable_actions__

      - name: 🔍 Detect Stack
        uses: ./__reusable_actions__/actions/detect-stack
        id: stack
        with:
          stack: ${{ inputs.stack }}
          project-path: ${{ needs.workdir.outputs.path }}

      - name: ⚙️ Setup Runtime
        uses: ./__reusable_actions__/actions/setup-runtime
        with:
          stack: ${{ steps.stack.outputs.stack }}
          stack-version: ${{ inputs.stack-version }}
          project-path: ${{ needs.workdir.outputs.path }}

      - name: 🧪 Run Tests
        uses: ./__reusable_actions__/actions/run-tests
        id: tests
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ needs.workdir.outputs.path }}
          coverage-mode: ${{ inputs.coverage-mode }}

      - name: 📊 Run Coverage
        uses: ./__reusable_actions__/actions/run-coverage
        id: coverage
        continue-on-error: ${{ inputs.coverage-continue-on-failure }}
        with:
          stack: ${{ steps.stack.outputs.stack }}
          project-path: ${{ needs.workdir.outputs.path }}
          coverage-min: ${{ inputs.coverage-min }}
          coverage-mode: ${{ inputs.coverage-mode }}
          github-token: ${{ secrets.GH_TOKEN }}

  promote:    
    needs: [resolve, workdir, quality-gate]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.workdir.outputs.path || '.' }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.head }}
          token: ${{ secrets.GH_TOKEN }}

      - name: 📌 Checkout reusable-workflows scripts
        uses: actions/checkout@v7
        with:
          repository: heliomarpm/reusable-workflows
          ref: main
          path: __reusable_actions__
          token: ${{ secrets.GH_TOKEN }}

      - name: 🔐 Auth GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 📊 Map coverage report
        id: coverage
        run: |
          echo "line=${{ needs.quality-gate.outputs.coverage_line }}" >> $GITHUB_OUTPUT
          echo "min=${{ needs.quality-gate.outputs.coverage_min }}" >> $GITHUB_OUTPUT
          echo "status=${{ needs.quality-gate.outputs.coverage_status || 'missing' }}" >> $GITHUB_OUTPUT
          echo "mode=${{ needs.quality-gate.outputs.coverage_mode }}" >> $GITHUB_OUTPUT

      - name: 🚀 Resolve Semantic Release
        id: semantic-release
        if: contains(needs.resolve.outputs.action, 'release') || contains(needs.resolve.outputs.action, 'on_release')
        uses: ./__reusable_actions__/actions/semantic-release
        with:
          project-path: ${{ needs.workdir.outputs.path || inputs.project-path || '.' }}
          branch: ${{ needs.resolve.outputs.head }}
          config: ${{ inputs.semantic-release-config }}
          dry-run: 'true'
          strict-mode: ${{ inputs.strict-conventional-commits }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: 🌱 Resolve and Ensure Target Branch
        id: branch
        run: |
          ACTION="${{ needs.resolve.outputs.action }}"
          BASE="${{ needs.resolve.outputs.base }}"
          MAIN="${{ inputs.main-branch }}"
          DEV="${{ inputs.develop-branch }}"
          VERSION="${{ steps.semantic-release.outputs.version }}"

          if [[ "$ACTION" == "pr_to_main_on_release" || "$ACTION" == "pr_to_release" ]]; then
            if [[ -z "$VERSION" ]]; then
              echo "::notice::No new release detected. Skipping PR."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          if [[ "$ACTION" == "pr_to_release" ]]; then
            # Higieniza a versão removendo sufixos de pré-release (ex: 1.0.0-dev.1 -> 1.0.0)
            CLEAN_VERSION="${VERSION%%-*}"
            BASE="${{ inputs.prefix-release-branch }}$CLEAN_VERSION"
          fi

          # Garante que a branch de destino existe no remoto
          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            if [[ "$BASE" == "$DEV" ]]; then
              echo "::notice::A branch '$BASE' não existe no remoto. Criando automaticamente a partir de '$MAIN'..."
              git fetch origin "$MAIN"
              git push origin "origin/$MAIN:refs/heads/$BASE"
            elif [[ "$ACTION" == "pr_to_release" ]]; then
              echo "::notice::Criando branch de release '$BASE' a partir de '$DEV'..."
              git checkout -b "$BASE"
              git push -u origin "$BASE"
            else
              echo "::error::A branch de destino '$BASE' não existe no repositório remoto."
              {
                echo "## ❌ Erro ao criar Pull Request"
                echo ""
                echo "A branch de destino **\`$BASE\`** não existe no repositório remoto."
                echo "👉 Crie a branch \`$BASE\` antes de abrir um PR para ela."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 📜 Create or Update Pull Request
        if: steps.branch.outputs.skip != 'true'
        uses: ./__reusable_actions__/actions/create-pr
        id: pr
        with:
          head: ${{ needs.resolve.outputs.head }}
          base: ${{ steps.branch.outputs.base }}
          pr-title: ${{ inputs.pr-title }}
          pr-body: ${{ inputs.pr-body }}
          pr-body-path: ${{ inputs.pr-body-path }}
          coverage-status: ${{ steps.coverage.outputs.status }}
          coverage-line: ${{ steps.coverage.outputs.line || ''}}
          coverage-min: ${{ steps.coverage.outputs.min || ''}}
          coverage-mode: ${{ steps.coverage.outputs.mode || ''}}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: 🧾 Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          BASH_ENV: ${{ github.workspace }}/__reusable_actions__/scripts/shared/shell-helpers.sh
        run: |
          # Carrega explicitamente os helpers usando o caminho absoluto do workspace
          HELPERS="${{ github.workspace }}/__reusable_actions__/scripts/shared/shell-helpers.sh"
          if [[ -f "$HELPERS" ]]; then
            source "$HELPERS"
          fi

          TEMPLATES_DIR="${{ github.workspace }}/__reusable_actions__/templates"
          IS_SKIPPED="${{ steps.branch.outputs.skip }}"
          PR_ACTION="${{ steps.pr.outputs.pr-action || steps.pr.outputs.pr_action }}"
          PR_URL="${{ steps.pr.outputs.pr-url || steps.pr.outputs.pr_url }}"
          BASE_BRANCH="${{ steps.branch.outputs.base }}"

          # # Fallback seguro caso append_template_to_summary não esteja disponível
          # if ! command -v append_template_to_summary &>/dev/null; then
          #   {
          #     echo "## 🔀 Auto Pull Request"
          #     echo ""
          #     echo "- **Estratégia:** \`${{ inputs.strategy }}\`"
          #     echo "- **Ação:** \`${{ needs.resolve.outputs.action }}\`"
          #     echo "- **Origem:** \`${{ needs.resolve.outputs.head }}\`"
          #     echo "- **Destino:** \`$BASE_BRANCH\`"
          #     echo "- **Pull Request:** $PR_URL"
          #   } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          #   exit 0
          # fi

          # 1. Ignorado pelo Semantic Release (nenhuma versão nova para release branch)
          if [[ "$IS_SKIPPED" == "true" ]]; then
            append_template_to_summary "$TEMPLATES_DIR/summary-promotion-skipped-release.md" \
              HEAD_BRANCH "${{ needs.resolve.outputs.head }}"

          # 2. Ignorado pelo create-pr (branches idênticas / sem novos commits)
          elif [[ "$PR_ACTION" == "skipped" ]]; then
            exit 0

          # 3. Pull Request criado ou atualizado com sucesso
          elif [[ -n "$PR_URL" && -n "$BASE_BRANCH" ]]; then
            append_template_to_summary "$TEMPLATES_DIR/summary-promotion.md" \
              STRATEGY "${{ inputs.strategy }}" \
              ACTION "${{ needs.resolve.outputs.action }}" \
              HEAD_BRANCH "${{ needs.resolve.outputs.head }}" \
              BASE_BRANCH "$BASE_BRANCH" \
              PR_URL "$PR_URL"

          # 4. Falha real durante a execução
          else
            append_template_to_summary "$TEMPLATES_DIR/summary-promotion-failed.md" \
              STRATEGY "${{ inputs.strategy }}" \
              ACTION "${{ needs.resolve.outputs.action }}" \
              HEAD_BRANCH "${{ needs.resolve.outputs.head }}"
          fi
