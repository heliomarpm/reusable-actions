name: CD - Pull Request

on:
  workflow_call:
    inputs:
      strategy:
        description: 'Promotion strategy (trunk | develop | gitflow)'
        required: false
        type: string
        default: 'develop'
      main-branch:
        description: 'Main branch name'
        required: false
        type: string
        default: 'main'
      develop-branch:
        description: 'Develop branch name'
        required: false
        type: string
        default: 'develop'
      prefix-release-branch:
        description: 'Release branch prefix (Used for gitflow strategy. ex. release-)'
        required: false
        type: string
        default: 'release-'
      semantic-release-config:
        description: 'Path to semantic-release configuration file (used only when strategy is gitflow or develop)'
        type: string
        required: false
      strict-conventional-commits:
        description: 'Enable strict mode for semantic-release (used only when strategy is gitflow or develop)'
        type: boolean
        required: false
        default: true
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      head: ${{ steps.engine.outputs.head }}
      base: ${{ steps.engine.outputs.base }}
      action: ${{ steps.engine.outputs.action }}
      skip: ${{ steps.engine.outputs.skip }}
    steps:
      - name: 🧠 Promotion Engine
        id: engine
        run: |
          STRATEGY="${{ inputs.strategy }}"
          HEAD="${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}"
          MAIN="${{ inputs.main-branch }}"
          DEV="${{ inputs.develop-branch }}"
          PREFIX="${{ inputs.prefix-release-branch }}"

          echo "→ Strategy: $STRATEGY"
          echo "→ Head: $HEAD"

          # Hotfix override
          if [[ "$HEAD" == hotfix/* ]]; then
            echo "base=$MAIN" >> $GITHUB_OUTPUT
            echo "head=$HEAD" >> $GITHUB_OUTPUT
            echo "action=pr_to_main" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Main branch — nada a promover
          if [[ "$HEAD" == "$MAIN" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            {
              echo "## 🔀 Auto PR (Ignorado)"
              echo ""
              echo "ℹ️ A branch atual é a \`$MAIN\` (destino final). Não há níveis superiores para criar um Pull Request de promoção."
              echo "👉 *Para gerar uma versão final, certifique-se de executar o workflow de Semantic Release.*"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$STRATEGY" in
            trunk)
              echo "base=$MAIN" >> $GITHUB_OUTPUT
              echo "action=pr_to_main" >> $GITHUB_OUTPUT
              ;;
            develop)
              if [[ "$HEAD" == "$DEV" ]]; then
                echo "base=$MAIN" >> $GITHUB_OUTPUT
                echo "action=pr_to_main_on_release" >> $GITHUB_OUTPUT
              else
                echo "base=$DEV" >> $GITHUB_OUTPUT
                echo "action=pr_to_develop" >> $GITHUB_OUTPUT
              fi
              ;;
            gitflow)
              if [[ "$HEAD" == "$DEV" ]]; then
                echo "base=__release__" >> $GITHUB_OUTPUT
                echo "action=pr_to_release" >> $GITHUB_OUTPUT
              elif [[ "$HEAD" == ${PREFIX}* ]]; then
                echo "base=$MAIN" >> $GITHUB_OUTPUT
                echo "action=pr_to_main" >> $GITHUB_OUTPUT
              else
                echo "base=$DEV" >> $GITHUB_OUTPUT
                echo "action=pr_to_develop" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "::error::Unknown strategy: $STRATEGY"
              exit 1
              ;;
          esac

          echo "head=$HEAD" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

  promote:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📌 Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: 📌 Checkout reusable-actions scripts
        uses: actions/checkout@v4
        with:
          repository: heliomarpm/reusable-actions
          ref: main
          path: __reusable_actions__
          token: ${{ secrets.GH_TOKEN }}

      - name: 🔐 Auth GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: 📥 Download coverage artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id || github.run_id }}"
          mkdir -p coverage
          echo "→ Buscando artefato de cobertura da execução CI #$RUN_ID..."
          if gh run download "$RUN_ID" -n coverage-report -D coverage 2>/dev/null; then
            echo "✅ Artefato de cobertura baixado com sucesso."
          else
            echo "ℹ️ Artefato de cobertura não encontrado para o run #$RUN_ID (opcional)."
          fi

      - name: 📊 Read coverage report
        id: coverage
        run: |
          FILE="coverage/coverage-summary.normalized.json"
          if [ -f "$FILE" ]; then
            LINE=$(jq -r '.line // empty' "$FILE")
            MIN=$(jq -r '.min // empty' "$FILE")
            STATUS=$(jq -r '.status // "passed"' "$FILE")
            MODE=$(jq -r '.mode // "info"' "$FILE")
            echo "line=$LINE" >> $GITHUB_OUTPUT
            echo "min=$MIN" >> $GITHUB_OUTPUT
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "mode=$MODE" >> $GITHUB_OUTPUT
          else
            echo "status=missing" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Resolve Semantic Release
        id: semantic-release
        if: contains(needs.resolve.outputs.action, 'release') || contains(needs.resolve.outputs.action, 'on_release')
        uses: ./__reusable_actions__/actions/semantic-release
        with:
          config: ${{ inputs.semantic-release-config }}
          dry-run: 'true'
          strict-mode: ${{ inputs.strict-conventional-commits }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: 🌱 Resolve and Ensure Target Branch
        id: branch
        run: |
          ACTION="${{ needs.resolve.outputs.action }}"
          BASE="${{ needs.resolve.outputs.base }}"
          MAIN="${{ inputs.main-branch }}"
          DEV="${{ inputs.develop-branch }}"
          VERSION="${{ steps.semantic-release.outputs.version }}"

          if [[ "$ACTION" == "pr_to_main_on_release" || "$ACTION" == "pr_to_release" ]]; then
            if [[ -z "$VERSION" ]]; then
              echo "::notice::No new release detected. Skipping PR."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          if [[ "$ACTION" == "pr_to_release" ]]; then
            BASE="${{ inputs.prefix-release-branch }}$VERSION"
          fi

          # Garante que a branch de destino existe no remoto
          if ! git ls-remote --exit-code --heads origin "$BASE" >/dev/null 2>&1; then
            if [[ "$BASE" == "$DEV" ]]; then
              echo "::notice::A branch '$BASE' não existe no remoto. Criando automaticamente a partir de '$MAIN'..."
              git fetch origin "$MAIN"
              git push origin "origin/$MAIN:refs/heads/$BASE"
            elif [[ "$ACTION" == "pr_to_release" ]]; then
              echo "::notice::Criando branch de release '$BASE' a partir de '$DEV'..."
              git checkout -b "$BASE"
              git push -u origin "$BASE"
            else
              echo "::error::A branch de destino '$BASE' não existe no repositório remoto."
              {
                echo "## ❌ Erro ao criar Pull Request"
                echo ""
                echo "A branch de destino **\`$BASE\`** não existe no repositório remoto."
                echo "👉 Crie a branch \`$BASE\` antes de abrir um PR para ela."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 📜 Create or Update Pull Request
        if: steps.branch.outputs.skip != 'true'
        uses: ./__reusable_actions__/actions/create-pr
        id: pr
        with:
          head: ${{ needs.resolve.outputs.head }}
          base: ${{ steps.branch.outputs.base }}
          coverage-status: ${{ steps.coverage.outputs.status }}
          coverage-line: ${{ steps.coverage.outputs.line }}
          coverage-min: ${{ steps.coverage.outputs.min }}
          coverage-mode: ${{ steps.coverage.outputs.mode }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: 🧾 Job summary
        if: always()
        env:
          BASH_ENV: ./__reusable_actions__/scripts/shared/shell-helpers.sh
        run: |
          if [[ "${{ steps.branch.outputs.skip }}" == "true" ]]; then
            append_template_to_summary ./__reusable_actions__/templates/summary-promotion-skipped-release.md \
              HEAD_BRANCH "${{ needs.resolve.outputs.head }}"
          else
            append_template_to_summary ./__reusable_actions__/templates/summary-promotion.md \
              STRATEGY "${{ inputs.strategy }}" \
              ACTION "${{ needs.resolve.outputs.action }}" \
              HEAD_BRANCH "${{ needs.resolve.outputs.head }}" \
              BASE_BRANCH "${{ steps.branch.outputs.base }}" \
              PR_URL "${{ steps.pr.outputs.pr_url }}"
          fi
