name: "CD - Release"

on:
  # push:
  #   branches:
  #     - main
  #     - develop
  #   paths-ignore:
  #     - 'CHANGELOG.md'

  # workflow_dispatch:
  #   inputs:
  #     enable-changelog:
  #       description: 'Gerar e atualizar o arquivo CHANGELOG.md'
  #       type: boolean
  #       default: true


  workflow_call:
    inputs:
      enable-changelog:
        description: 'Gerar e atualizar o arquivo CHANGELOG.md (opcional)'
        type: boolean
        required: false
        default: true
      changelog-file:
        description: 'Caminho do arquivo de changelog'
        type: string
        required: false
        default: 'CHANGELOG.md'
      changelog-title:
        description: 'Título/cabeçalho inicial do CHANGELOG.md'
        type: string
        required: false
        default: "# 📦 Changelog\n\nAll notable changes to this project will be documented in this file."
      project-path:
        description: 'Caminho da raiz do projeto contendo o repositório git'
        type: string
        required: false
        default: '.'
      commit-changelog:
        description: 'Fazer commit e push do CHANGELOG.md'
        type: boolean
        required: false
        default: true
      version-format:
        description: 'Formato da versão (ex: "v%major.%minor.%patch" ou "%YYYY-%mm-%dd")'
        type: string
        required: false
        default: ''
      prerelease-strategy:
        description: 'Estratégia de pre-release para branches de release ("rc" ou "same-tag")'
        type: string
        required: false
        default: 'rc'
      prerelease-suffix:
        description: 'Sufixo da pre-release quando strategy for "rc" (default: "rc")'
        type: string
        required: false
        default: 'rc'
      prerelease-branches:
        description: 'Padrões glob de branches de pre-release separados por vírgula (default: "release-*,release/*")'
        type: string
        required: false
        default: 'release-*,release/*'
    secrets:
      GH_TOKEN:
        required: false
        description: 'GitHub token para autenticação e criação de releases (usa GITHUB_TOKEN se omitido)'

    outputs:
      version:
        description: 'Versão aplicada (ex: 1.0.0, 2026-10-04, etc)'
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: 'Git Tag criada (se houver release)'
        value: ${{ jobs.release.outputs.tag }}
      has-changes:
        description: 'Se houveram commits processados'
        value: ${{ jobs.release.outputs.has-changes }}

permissions:
  contents: write       # Permite criar e atualizar tags, commits (changelog), pushes e releases no GitHub
  # issues: write         # (opcional) → se você quiser que o release crie comentários em issues.
  # pull-requests: write  # (opcional) → se quiser que o release comente em PRs.
  # checks: read          # (opcional) → se precisar ler check runs  
  # statuses: write       # (opcional) → se precisar criar e atualizar status checks  
  # actions: read         # (opcional) → se precisar ler action runs


jobs:
  release:
    name: 🚀 Release & Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version || steps.changelog.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      has-changes: ${{ steps.release.outputs.has-changes || steps.changelog.outputs.has-changes }}

    steps:
      - name: 📌 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📝 Update Changelog
        if: ${{ inputs.enable-changelog != false }}
        id: changelog
        uses: heliomarpm/reusable-workflows/actions/changelog@main
        with:
          project-path: ${{ inputs.project-path || '.' }}
          changelog-file: ${{ inputs.changelog-file || 'CHANGELOG.md' }}
          changelog-title: ${{ inputs.changelog-title }}
          version-format: ${{ inputs.version-format || '' }}
          prerelease-strategy: ${{ inputs.prerelease-strategy || 'rc' }}
          prerelease-suffix: ${{ inputs.prerelease-suffix || 'rc' }}
          prerelease-branches: ${{ inputs.prerelease-branches || 'release-*,release/*' }}
          commit-changelog: ${{ inputs.commit-changelog != false }}
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🚀 Create Git Tag & Release
        id: release
        uses: heliomarpm/reusable-workflows/actions/release@main
        with:
          project-path: ${{ inputs.project-path || '.' }}
          version: ${{ steps.changelog.outputs.version }}
          version-format: ${{ inputs.version-format || '' }}
          prerelease-strategy: ${{ inputs.prerelease-strategy || 'rc' }}
          prerelease-suffix: ${{ inputs.prerelease-suffix || 'rc' }}
          prerelease-branches: ${{ inputs.prerelease-branches || 'release-*,release/*' }}
          release-notes: ${{ steps.changelog.outputs.release-notes }}
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🧾 Job Summary (Fallback em Falha)
        if: failure()
        run: |
          {
            echo "## ❌ Falha no Workflow de Release"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Status:** Ocorreu um erro durante a execução da pipeline de release."
            echo "- Verifique os logs das etapas anteriores para detalhes do erro."
          } >> "$GITHUB_STEP_SUMMARY"
