name: "CD - Release"

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'CHANGELOG.md'

  workflow_dispatch:
    inputs:
      create-release:
        description: 'Forçar criação de Git Tag e GitHub Release'
        type: boolean
        default: false
      version-format:
        description: 'Formato da versão (ex: "v%major.%minor.%patch" ou "%YYYY-%mm-%dd")'
        type: string
        default: ''

  workflow_call:
    inputs:
      create-release:
        description: 'Criar Git Tag e GitHub Release (default: true no main)'
        type: boolean
        required: false
        default: true
      version-format:
        description: 'Formato da versão (ex: "v%major.%minor.%patch" ou "%YYYY-%mm-%dd")'
        type: string
        required: false
        default: ''
      changelog-file:
        description: 'Caminho do arquivo de changelog'
        type: string
        required: false
        default: 'CHANGELOG.md'
      project-path:
        description: 'Caminho da raiz do projeto contendo o repositório git'
        type: string
        required: false
        default: '.'
      commit-changelog:
        description: 'Fazer commit e push do CHANGELOG.md'
        type: boolean
        required: false
        default: true
    secrets:
      GH_TOKEN:
        required: false
        description: 'GitHub token para autenticação e criação de releases (usa GITHUB_TOKEN se omitido)'
        
    outputs:
      version:
        description: 'Versão aplicada (ex: 1.0.0, 2026-10-04, etc)'
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: 'Git Tag criada (se create-release for true)'
        value: ${{ jobs.release.outputs.tag }}
      has-changes:
        description: 'Se houveram commits processados'
        value: ${{ jobs.release.outputs.has-changes }}

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Release & Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tag: ${{ steps.changelog.outputs.tag }}
      has-changes: ${{ steps.changelog.outputs.has-changes }}

    steps:
      - name: 📌 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🚀 Run Changelog & Release
        id: changelog
        uses: heliomarpm/reusable-actions/actions/changelog@main
        with:
          project-path: ${{ inputs.project-path || '.' }}
          changelog-file: ${{ inputs.changelog-file || 'CHANGELOG.md' }}
          version-format: ${{ inputs.version-format || '' }}
          commit-changelog: ${{ inputs.commit-changelog != false }}
          create-release: ${{ (github.event_name == 'workflow_call' && (inputs.create-release != false)) || (github.event_name == 'workflow_dispatch' && inputs.create-release) || (github.event_name == 'push' && github.ref_name == 'main') }}
          github-token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🧾 Job Summary
        if: always()
        run: |
          {
            echo "## 🚀 Release & Changelog"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Versão:** \`${{ steps.changelog.outputs.version || 'N/A' }}\`"
            echo "- **Tag:** \`${{ steps.changelog.outputs.tag || 'N/A' }}\`"
            echo "- **Release Criada:** \`${{ steps.changelog.outputs.tag != '' && 'Sim' || 'Não' }}\`"
            echo "- **Changelog Atualizado:** \`${{ steps.changelog.outputs.has-changes == 'true' && 'Sim' || 'Não' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
